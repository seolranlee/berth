<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>berth — Claude Code sessions</title>
    <!-- 스타일링은 후순위: 가독성만 확보한 최소 CSS -->
    <style>
      body { font-family: system-ui, sans-serif; max-width: 860px; margin: 24px auto; padding: 0 16px; color: #222; }
      h1 { font-size: 18px; }
      .meta { color: #888; font-size: 12px; margin-bottom: 12px; }
      #q { width: 100%; padding: 8px 10px; font-size: 14px; box-sizing: border-box; margin-bottom: 16px; }
      .card { border: 1px solid #e2e2e2; border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; }
      .title { font-weight: 600; }
      .sub { color: #777; font-size: 12px; margin-top: 4px; }
      .cmd { font-family: ui-monospace, monospace; font-size: 12px; background: #f5f5f5; padding: 2px 6px; border-radius: 4px; }
      button { font-size: 12px; padding: 4px 10px; cursor: pointer; border: 1px solid #ccc; border-radius: 6px; background: #fff; }
      .last { color: #999; font-size: 12px; margin-top: 6px; }
    </style>
  </head>
  <body>
    <h1>⚓ berth</h1>
    <div class="meta" id="meta">불러오는 중…</div>
    <input id="q" placeholder="제목 / 프로젝트 / 브랜치 검색…" />
    <div id="list"></div>

    <script>
      let all = [];
      const listEl = document.getElementById('list');
      const metaEl = document.getElementById('meta');
      const qEl = document.getElementById('q');

      function render(items) {
        listEl.innerHTML = '';
        for (const s of items) {
          const card = document.createElement('div');
          card.className = 'card';
          const when = (s.updatedAt || '').slice(0, 16).replace('T', ' ');
          const loc = `${s.project || '?'}${s.gitBranch ? ' · ' + s.gitBranch : ''}`;
          card.innerHTML = `
            <div class="title"></div>
            <div class="sub">${when} · ${loc} · ${s.userTurns} turns</div>
            <div style="margin-top:8px">
              <span class="cmd">${s.resumeCommand}</span>
              <button data-launch="${s.sessionId}">실행 ▶</button>
              <button data-cmd="${s.resumeCommand}">복사</button>
            </div>
            ${s.lastPrompt ? `<div class="last">⤷ ${escapeHtml(s.lastPrompt.slice(0, 100))}</div>` : ''}
          `;
          card.querySelector('.title').textContent = s.title;
          listEl.appendChild(card);
        }
      }

      function escapeHtml(s) {
        return s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      }

      listEl.addEventListener('click', async (e) => {
        // 복사
        const copyBtn = e.target.closest('button[data-cmd]');
        if (copyBtn) {
          await navigator.clipboard.writeText(copyBtn.dataset.cmd);
          const prev = copyBtn.textContent;
          copyBtn.textContent = '복사됨 ✓';
          setTimeout(() => (copyBtn.textContent = prev), 1200);
          return;
        }
        // 실행 (터미널에서 resume)
        const launchBtn = e.target.closest('button[data-launch]');
        if (launchBtn) {
          const prev = launchBtn.textContent;
          launchBtn.textContent = '실행 중…';
          launchBtn.disabled = true;
          try {
            const r = await fetch(`/api/sessions/${launchBtn.dataset.launch}/launch`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ terminal: 'warp' }),
            });
            const data = await r.json();
            if (r.ok) {
              launchBtn.textContent = '실행됨 ✓';
            } else {
              launchBtn.textContent = '실패';
              alert('실행 실패: ' + (data.error || r.status));
            }
          } catch (err) {
            launchBtn.textContent = '실패';
            alert('실행 실패: ' + err);
          }
          setTimeout(() => {
            launchBtn.textContent = prev;
            launchBtn.disabled = false;
          }, 1500);
          return;
        }
      });

      qEl.addEventListener('input', () => {
        const q = qEl.value.toLowerCase().trim();
        if (!q) return render(all);
        render(
          all.filter((s) =>
            [s.title, s.project, s.gitBranch, s.lastPrompt]
              .filter(Boolean)
              .some((f) => f.toLowerCase().includes(q)),
          ),
        );
      });

      fetch('/api/sessions')
        .then((r) => r.json())
        .then((data) => {
          all = data;
          metaEl.textContent = `세션 ${data.length}개`;
          render(all);
        })
        .catch((err) => (metaEl.textContent = '에러: ' + err));
    </script>
  </body>
</html>
